[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boardlink"
version = "0.1.3"
description = "Connect to climbing-board apps (Kilter, Tension, MoonBoard) and pull normalized logbooks."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "milwil-2" }]
keywords = ["climbing", "kilter", "tension", "moonboard", "logbook"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/milwil-2/boardlink"
Repository = "https://github.com/milwil-2/boardlink"
Issues = "https://github.com/milwil-2/boardlink/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/boardlink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
